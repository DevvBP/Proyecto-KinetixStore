# ===================================================================
# CONFIGURACIÓN DE LA APLICACIÓN SPRING BOOT - KINEXSTORE
# ===================================================================
spring.application.name=kinexstore-spring
server.port=8080

# -------------------------------------------------------------------
# 1. CONFIGURACIÓN DE CONEXIÓN A BASE DE DATOS MYSQL
# -------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/kinexstore_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=852134679Bb*-
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# 2. CONFIGURACIÓN DE HIBERNATE / JPA
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# 3. CONFIGURACIÓN DEL VIEW RESOLVER PARA VISTAS JSP
# -------------------------------------------------------------------
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# -------------------------------------------------------------------
# 4. CONFIGURACIÓN DE SUBIDA DE ARCHIVOS (Imágenes de productos)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------------------------------------
# 5. CONFIGURACIÓN TOMCAT EMBEBIDO - JSP
# -------------------------------------------------------------------
# Permite que Jasper recompile JSPs al guardar cambios (desarrollo)
server.servlet.jsp.init-parameters.development=true
# Logging de errores JSP detallado
server.servlet.jsp.init-parameters.suppressSmap=false

# -------------------------------------------------------------------
# 6. LOGGING
# -------------------------------------------------------------------
logging.level.co.kinexstore=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
